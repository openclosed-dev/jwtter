services:
  devcontainer:
    build:
      context: .
      args:
        - USERNAME=${USER:?err}
        - USER_UID=${COMPOSE_USER_ID:?err}
        - USER_GID=${COMPOSE_GROUP_ID:?err}
    command: sleep infinity
    volumes:
      - type: bind
        source: ../
        target: /workspaces/${PROJECT_NAME:?err}
        consistency: cached
